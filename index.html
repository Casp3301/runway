<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runway</title>
<style>
  :root {
    --cream: #f5e8cd;
    --ink: #1a1a1e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
  }
  .stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(24px, 5vh, 60px);
    padding: 6vh 5vw;
  }
  .header {
    font-size: clamp(11px, 2.4vw, 15px);
    letter-spacing: 0.55em;
    text-indent: 0.55em;
    font-weight: 400;
    text-align: center;
    white-space: nowrap;
  }
  .bars {
    display: flex;
    gap: clamp(14px, 3.2vw, 34px);
    height: clamp(160px, 40vh, 340px);
  }
  .bar {
    width: clamp(20px, 4.4vw, 46px);
    border-radius: 999px;
    height: 100%;
  }
  .bar:nth-child(1) { background: #d6281a; }
  .bar:nth-child(2) { background: #f36a21; }
  .bar:nth-child(3) { background: #f7b51e; }
  .bar:nth-child(4) { background: #00b050; }
  .bar:nth-child(5) { background: #1d2d6a; }
  .name {
    font-size: clamp(26px, 6vw, 52px);
    font-weight: 700;
    letter-spacing: 0.01em;
    text-align: center;
    min-height: 1.2em;
    line-height: 1.2;
    transition: opacity 180ms ease;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
  }
  .overlay span {
    font-size: clamp(13px, 3vw, 18px);
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    border: 1.5px solid var(--ink);
    padding: 18px 34px;
    border-radius: 999px;
  }
  .overlay.hidden { display: none; }
</style>
</head>
<body>
  <div class="stage">
    <div class="header">TAKE&nbsp;OFF&nbsp;FROM&nbsp;THE&nbsp;RUNWAY</div>
    <div class="bars">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
    <div class="name" id="name"></div>
  </div>

  <div class="overlay" id="overlay"><span>TAKE&nbsp;OFF</span></div>

  <audio id="audio" src="music.mp3" loop preload="auto"></audio>

  <script>
    var names = [
      "Howdy",
      "Starfish",
      "Al",
      "Clowntown",
      "Marvick",
      "TheAbyss",
      "Darmicul",
      "✰ʇ𝖊ᴧ𝖒٥Åȵžї𝗅ā✰",
      "Casp"
    ];

    var nameEl = document.getElementById("name");
    var idx = 0;
    var hue = 0;

    // hue rotates continuously; the name recolors every frame
    function tick() {
      hue = (hue + 0.9) % 360;
      nameEl.style.color = "hsl(" + hue + ", 75%, 42%)";
      requestAnimationFrame(tick);
    }

    function swap() {
      nameEl.style.opacity = "0";
      setTimeout(function () {
        nameEl.textContent = names[idx];
        idx = (idx + 1) % names.length;
        nameEl.style.opacity = "1";
      }, 180);
    }

    nameEl.textContent = names[0];
    idx = 1;
    tick();
    setInterval(swap, 620);

    var overlay = document.getElementById("overlay");
    var audio = document.getElementById("audio");
    overlay.addEventListener("click", function () {
      audio.volume = 1;
      audio.play().catch(function () {});
      overlay.classList.add("hidden");
    });
  </script>
</body>
</html>
