<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runway</title>
<style>
  :root {
    --cream: #f5e8cd;
    --ink: #1a1a1e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
  }
  .stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(22px, 4.5vh, 52px);
    padding: 6vh 5vw;
  }
  .header {
    font-size: clamp(11px, 2.4vw, 15px);
    letter-spacing: 0.55em;
    text-indent: 0.55em;
    font-weight: 400;
    text-align: center;
    white-space: nowrap;
  }
  .bars {
    display: flex;
    gap: clamp(14px, 3.2vw, 34px);
    height: clamp(150px, 36vh, 320px);
  }
  .bar { width: clamp(20px, 4.4vw, 46px); border-radius: 999px; height: 100%; }
  .bar:nth-child(1) { background: #d6281a; }
  .bar:nth-child(2) { background: #f36a21; }
  .bar:nth-child(3) { background: #f7b51e; }
  .bar:nth-child(4) { background: #00b050; }
  .bar:nth-child(5) { background: #1d2d6a; }
  .clip {
    width: clamp(150px, 26vw, 260px);
    height: auto;
    border-radius: 10px;
    display: block;
  }
  .name {
    font-size: clamp(26px, 6vw, 52px);
    font-weight: 700;
    letter-spacing: 0.01em;
    text-align: center;
    min-height: 1.2em;
    line-height: 1.2;
    transition: opacity 180ms ease;
  }
  .caspbot {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--ink);
    color: var(--cream);
    border: none;
    border-radius: 999px;
    padding: 13px 22px;
    font: 600 15px/1 "Segoe UI", sans-serif;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 120ms ease;
  }
  .caspbot:hover { transform: translateY(-1px); }
  .caspbot .sz {
    font: 500 12px/1 "Consolas", monospace;
    opacity: 0.72;
    padding-left: 12px;
    border-left: 1px solid rgba(245,232,205,0.4);
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
  }
  .overlay span {
    font-size: clamp(13px, 3vw, 18px);
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    border: 1.5px solid var(--ink);
    padding: 18px 34px;
    border-radius: 999px;
  }
  .overlay.hidden { display: none; }

  /* password gate */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(20,20,24,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 20px;
  }
  .modal-bg[hidden] { display: none; }
  .modal {
    width: min(380px, 100%);
    background: var(--cream);
    border: 1.5px solid var(--ink);
    border-radius: 14px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
  }
  .modal.shake { animation: shake 0.32s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  .modal h2 { font-size: 17px; font-weight: 800; letter-spacing: 0.01em; }
  .modal .file {
    display: flex;
    justify-content: space-between;
    font: 13px/1.4 "Consolas", monospace;
    background: #efe4c8;
    border-radius: 8px;
    padding: 10px 12px;
  }
  .modal p { font-size: 13px; line-height: 1.5; opacity: 0.85; }
  .modal input {
    border: 1px solid rgba(26,26,30,0.4);
    border-radius: 8px;
    padding: 11px 12px;
    font: 15px "Consolas", monospace;
    background: #fffaf0;
    color: var(--ink);
  }
  .modal .err { color: #c0271a; font-size: 12.5px; min-height: 1.2em; }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal button {
    border: 1px solid var(--ink);
    border-radius: 8px;
    padding: 10px 16px;
    font: 600 13px "Segoe UI", sans-serif;
    cursor: pointer;
    background: transparent;
    color: var(--ink);
  }
  .modal button.primary { background: var(--ink); color: var(--cream); }

  @media (max-height: 680px) {
    .stage { gap: clamp(14px, 2.6vh, 30px); }
    .bars { height: clamp(110px, 28vh, 220px); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="header">TAKE&nbsp;OFF&nbsp;FROM&nbsp;THE&nbsp;RUNWAY</div>
    <div class="bars">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
    <video class="clip" id="clip" src="video.mp4" muted autoplay loop playsinline></video>
    <div class="name" id="name"></div>
    <button class="caspbot" id="caspbot">Download CaspBot <span class="sz">CaspBot_Setup.exe · 95 GB</span></button>
  </div>

  <div class="overlay" id="overlay"><span>TAKE&nbsp;OFF</span></div>

  <div class="modal-bg" id="modalBg" hidden>
    <div class="modal" id="modal">
      <h2>Protected download</h2>
      <div class="file"><span>CaspBot_Setup.exe</span><span>95 GB</span></div>
      <p>This file is password-protected. Enter the access password to begin downloading.</p>
      <input type="password" id="pw" placeholder="Password" autocomplete="off" spellcheck="false">
      <div class="err" id="pwErr"></div>
      <div class="actions">
        <button id="pwCancel">Cancel</button>
        <button class="primary" id="pwUnlock">Unlock &amp; Download</button>
      </div>
    </div>
  </div>

  <audio id="audio" src="music.mp3" loop preload="auto"></audio>

  <script>
    var names = [
      "Howdy",
      "Starfish",
      "Al",
      "Clowntown",
      "Marvick",
      "TheAbyss",
      "Darmicul",
      "✰ʇ𝖊ᴧ𝖒٥Åȵžї𝗅ā✰",
      "Casp"
    ];

    var nameEl = document.getElementById("name");
    var idx = 0, hue = 0;

    function tick() {
      hue = (hue + 0.9) % 360;
      nameEl.style.color = "hsl(" + hue + ", 75%, 42%)";
      requestAnimationFrame(tick);
    }
    function swap() {
      nameEl.style.opacity = "0";
      setTimeout(function () {
        nameEl.textContent = names[idx];
        idx = (idx + 1) % names.length;
        nameEl.style.opacity = "1";
      }, 180);
    }
    nameEl.textContent = names[0];
    idx = 1;
    tick();
    setInterval(swap, 620);

    var overlay = document.getElementById("overlay");
    var audio = document.getElementById("audio");
    var clip = document.getElementById("clip");
    overlay.addEventListener("click", function () {
      audio.volume = 1;
      audio.play().catch(function () {});
      clip.muted = true;
      clip.play().catch(function () {});
      overlay.classList.add("hidden");
    });

    // Download CaspBot — flaunts a 95 GB file, gated behind a password that is never accepted.
    // The typed password is only compared in-page and discarded; it is never sent anywhere.
    var modalBg = document.getElementById("modalBg");
    var modal = document.getElementById("modal");
    var pw = document.getElementById("pw");
    var pwErr = document.getElementById("pwErr");

    document.getElementById("caspbot").addEventListener("click", function () {
      pw.value = "";
      pwErr.textContent = "";
      modalBg.hidden = false;
      pw.focus();
    });
    function closeModal() { modalBg.hidden = true; }
    document.getElementById("pwCancel").addEventListener("click", closeModal);
    modalBg.addEventListener("click", function (e) { if (e.target === modalBg) closeModal(); });

    function reject() {
      pwErr.textContent = "Incorrect password. Access denied.";
      modal.classList.remove("shake");
      void modal.offsetWidth;
      modal.classList.add("shake");
      pw.value = "";
      pw.focus();
    }
    document.getElementById("pwUnlock").addEventListener("click", reject);
    pw.addEventListener("keydown", function (e) { if (e.key === "Enter") reject(); });
  </script>
</body>
</html>
